name: Build Bubble Kingdom APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate and Prepare Project
        run: |
          echo "=== Searching for settings.gradle.kts ==="
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found anywhere in repository!"
            echo "Current files in repo:"
            find . -maxdepth 3
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project located in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          cd "$PROJECT_DIR"
          touch .env
          touch .env.example

          # Generate debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          # Fix configs for CI build
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/\/\/ removed for CI/g' app/build.gradle.kts || true
          sed -i 's/compileSdk {.*}/compileSdk = 35/g' app/build.gradle.kts || true
          sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts || true
          sed -i '/foojay-resolver-convention/d' settings.gradle.kts || true

      - name: Build Debug APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-Kingdom-Debug-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          retention-days: 7
