name: Build Bubble Kingdom APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          touch .env.example
          # Generate debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          # Safe fallback for debugConfig
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/\/\/ removed for CI/g' app/build.gradle.kts || true
          # Use pre-installed stable Android SDK 35 instead of uninstalled SDK 36 preview
          sed -i 's/compileSdk {.*}/compileSdk = 35/g' app/build.gradle.kts || true
          sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts || true
          # Remove foojay resolver
          sed -i '/foojay-resolver-convention/d' settings.gradle.kts || true

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-Kingdom-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
