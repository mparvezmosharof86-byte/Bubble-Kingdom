name: Build Bubble Kingdom APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate and Prepare Project
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project located in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          cd "$PROJECT_DIR"
          touch .env
          touch .env.example

          # Generate debug.keystore
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          # Fix configs for CI build
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/\/\/ removed for CI/g' app/build.gradle.kts || true
          sed -i 's/compileSdk {.*}/compileSdk = 35/g' app/build.gradle.kts || true
          sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts || true
          sed -i '/foojay-resolver-convention/d' settings.gradle.kts || true

          # Fix core-ktx to 1.15.0 to match compileSdk 35
          sed -i 's/coreKtx = .*/coreKtx = "1.15.0"/g' gradle/libs.versions.toml || true

      - name: Generate App Launcher Icons from app_icon.png
        run: |
          ICON_FILE=$(find . -iname "*app_icon*.png" -o -iname "*icon*.png" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            echo "Found custom app icon: $ICON_FILE"
            python3 -c "
          from PIL import Image
          import os, shutil

          img = Image.open('$ICON_FILE').convert('RGBA')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }
          res_base = os.path.join('$PROJECT_DIR', 'app', 'src', 'main', 'res')
          for folder, sz in sizes.items():
              target_dir = os.path.join(res_base, folder)
              os.makedirs(target_dir, exist_ok=True)
              r = img.resize((sz, sz), Image.Resampling.LANCZOS)
              r.save(os.path.join(target_dir, 'ic_launcher.png'))
              r.save(os.path.join(target_dir, 'ic_launcher_round.png'))

          # Remove legacy XML template so custom 3D PNG displays everywhere
          anydpi_dir = os.path.join(res_base, 'mipmap-anydpi-v26')
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir)
          print('3D App Icons generated successfully for all Android densities!')
          "
          else
            echo "No custom icon found, skipping."
          fi

      - name: Build Debug APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare Direct APK
        run: |
          mkdir -p release_apk
          find . -name "*.apk" -exec cp {} release_apk/Bubble-Kingdom.apk \;

      - name: Create Direct APK Release (No Zip Needed!)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Bubble Kingdom Direct APK"
          body: "Direct APK file ready to install on Android with custom 3D app icon!"
          files: release_apk/Bubble-Kingdom.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
