name: Build Play Store Release AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release AAB & Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate and Prepare Project
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Project located in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          cd "$PROJECT_DIR"
          touch .env
          touch .env.example

          # Generate Permanent Release Keystore for Play Store (.jks)
          echo "Generating Nova Studio 24 Release Keystore..."
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass nova24secret -keypass nova24secret -dname "CN=Nova Studio 24,O=Nova Studio,C=BD"

          # Fix configs for CI build
          sed -i 's/compileSdk {.*}/compileSdk = 35/g' app/build.gradle.kts || true
          sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts || true
          sed -i '/foojay-resolver-convention/d' settings.gradle.kts || true
          sed -i 's/coreKtx = .*/coreKtx = "1.15.0"/g' gradle/libs.versions.toml || true

      - name: Generate App Launcher Icons
        run: |
          ICON_FILE=$(find . -iname "*app_icon*.png" -o -iname "*icon*.png" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            echo "Found custom app icon: $ICON_FILE"
            cat << 'EOF' > Resize.java
          import javax.imageio.ImageIO;
          import java.awt.*;
          import java.awt.image.BufferedImage;
          import java.io.File;

          public class Resize {
              public static void main(String[] args) throws Exception {
                  File src = new File(args[0]);
                  File resBase = new File(args[1]);
                  BufferedImage img = ImageIO.read(src);

                  int[] sizes = {48, 72, 96, 144, 192};
                  String[] folders = {"mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"};

                  for (int i = 0; i < sizes.length; i++) {
                      int sz = sizes[i];
                      File dir = new File(resBase, folders[i]);
                      dir.mkdirs();

                      BufferedImage resized = new BufferedImage(sz, sz, BufferedImage.TYPE_INT_ARGB);
                      Graphics2D g = resized.createGraphics();
                      g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC);
                      g.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY);
                      g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
                      g.drawImage(img, 0, 0, sz, sz, null);
                      g.dispose();

                      ImageIO.write(resized, "png", new File(dir, "ic_launcher.png"));
                      ImageIO.write(resized, "png", new File(dir, "ic_launcher_round.png"));
                  }
                  System.out.println("3D App Icons generated successfully!");
              }
          }
          EOF
            java Resize.java "$ICON_FILE" "$PROJECT_DIR/app/src/main/res"
            rm -f Resize.java
            rm -rf "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v26"
          fi

      - name: Build Signed Release AAB with Gradle
        run: |
          cd "$PROJECT_DIR"
          export STORE_PASSWORD=nova24secret
          export KEY_PASSWORD=nova24secret
          gradle bundleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare Release Artifacts (.aab & .jks)
        run: |
          mkdir -p release_bundle
          find . -name "*.aab" -exec cp {} release_bundle/Bubble-Kingdom-Release.aab \;
          find . -name "my-upload-key.jks" -exec cp {} release_bundle/my-upload-key.jks \;

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-store-release-v1
          name: "Bubble Kingdom - Play Store Release AAB"
          body: |
            ### 👑 Bubble Kingdom Official Release AAB & Keystore
            - **Package Name:** `com.novastudio24.bubblekingdom`
            - **Studio:** Nova Studio 24
            - **Keystore Password:** `nova24secret`
            - **Key Alias:** `upload`
            
            Upload `Bubble-Kingdom-Release.aab` directly to Google Play Console!
            *Keep your `my-upload-key.jks` safe for future game updates.*
          files: |
            release_bundle/Bubble-Kingdom-Release.aab
            release_bundle/my-upload-key.jks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
